<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESK-ROX | Live Circuit Leaderboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Anton -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hazardYellow: '#FFD700',
                        hazardBlack: '#111111',
                        darkPanel: '#1A1A1A',
                        cardBorder: '#333333',
                        gold: '#FFD700',
                        silver: '#C0C0C0',
                        bronze: '#CD7F32'
                    },
                    fontFamily: {
                        anton: ['Anton', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #f3f4f6; overflow-x: hidden; }
        .hazard-stripes { background: repeating-linear-gradient(-45deg, #FFD700, #FFD700 20px, #111111 20px, #111111 40px); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111111; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FFD700; }
        
        .podium-1 { border-left: 6px solid #FFD700; background: linear-gradient(90deg, rgba(255,215,0,0.1) 0%, rgba(26,26,26,1) 30%); }
        .podium-2 { border-left: 6px solid #C0C0C0; background: linear-gradient(90deg, rgba(192,192,192,0.1) 0%, rgba(26,26,26,1) 30%); }
        .podium-3 { border-left: 6px solid #CD7F32; background: linear-gradient(90deg, rgba(205,127,50,0.1) 0%, rgba(26,26,26,1) 30%); }
        
        .text-gold { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .text-silver { color: #C0C0C0; text-shadow: 0 0 10px rgba(192,192,192,0.3); }
        .text-bronze { color: #CD7F32; text-shadow: 0 0 10px rgba(205,127,50,0.3); }
        .hidden { display: none !important; }
        
        #loader { position: fixed; inset: 0; background: rgba(13, 13, 13, 0.95); z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-hazardYellow selection:text-black relative">

    <div id="loader">
        <i class="fa-solid fa-fire text-6xl text-hazardYellow mb-4 animate-pulse"></i>
        <h2 class="font-anton text-2xl tracking-widest uppercase text-white">Initializing Circuit...</h2>
    </div>

    <div class="h-4 hazard-stripes w-full shadow-lg z-10"></div>

    <header class="bg-darkPanel border-b border-cardBorder py-6 px-6 md:px-12 flex flex-col sm:flex-row justify-between items-center gap-4 relative overflow-hidden">
        <div class="absolute -bottom-16 left-5 opacity-5 pointer-events-none text-9xl font-anton">
            <i class="fa-solid fa-fire"></i>
        </div>
        
        <div class="flex items-center gap-4 z-10 w-full justify-center md:justify-start">
            <div id="participantCounter" class="bg-hazardYellow text-black font-anton px-4 py-2 text-xl md:text-2xl tracking-wider rounded skew-x-[-6deg] shadow-lg border-2 border-black flex items-center gap-2">
                <span class="w-3 h-3 bg-red-600 rounded-full animate-pulse border border-black"></span>
                AWAITING DATA...
            </div>
            <div>
                <h1 class="text-3xl md:text-5xl font-anton tracking-widest uppercase text-white drop-shadow-md">
                    DESK-ROX <span class="text-hazardYellow ml-2">CIRCUIT</span>
                </h1>
                <p class="text-xs md:text-sm text-gray-400 tracking-widest uppercase mt-1">THE ULTIMATE CORPORATE CIRCUIT</p>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
        <div class="w-full max-w-6xl">
            <div id="publicView" class="w-full animate-fade-in">
                <div class="grid grid-cols-12 gap-4 text-gray-500 font-anton tracking-widest uppercase text-sm md:text-xl border-b-2 border-cardBorder pb-2 mb-4 px-4">
                    <div class="col-span-2 text-center">Rank</div>
                    <div class="col-span-6">Competitor Name</div>
                    <div class="col-span-4 text-right">Total Time (Sec)</div>
                </div>

                <div id="leaderboardList" class="flex flex-col gap-3">
                    <!-- Leaderboard Rows Injected Here -->
                </div>
                
                <!-- Expand / Collapse Button -->
                <div class="mt-8 flex justify-center">
                    <button id="toggleBtn" onclick="toggleView()" class="hidden bg-transparent border-2 border-cardBorder hover:border-hazardYellow text-gray-400 hover:text-hazardYellow font-anton uppercase tracking-widest px-8 py-3 rounded transition-all duration-300">
                        <i class="fa-solid fa-chevron-down mr-2"></i> VIEW FULL ROSTER
                    </button>
                </div>

                <div id="emptyState" class="hidden text-center py-20 text-gray-600 font-anton text-2xl tracking-widest uppercase">
                    <i class="fa-solid fa-hourglass-empty mb-4 text-4xl"></i><br>
                    Awaiting Circuit Finishers
                </div>
            </div>
        </div>
    </main>

    <script>
        // Direct Export CSV Link
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1lZysX-awKyUDVQEWFh75NjAA5pAA2_gZ0wBpRfPYTl8/export?format=csv';

        const loader = document.getElementById('loader');
        const leaderboardList = document.getElementById('leaderboardList');
        const emptyState = document.getElementById('emptyState');
        const counterElement = document.getElementById('participantCounter');
        const toggleBtn = document.getElementById('toggleBtn');
        
        let initialLoad = true;
        let isExpanded = false;

        window.toggleView = function() {
            isExpanded = !isExpanded;
            renderData(window.currentCompetitors || [], window.latestFinisher); 
        };

        // Helper function to assign tier badges based on time
        function getTierBadge(time) {
            if (time <= 30.00) {
                return `<span class="text-xs bg-purple-900/60 text-purple-300 border border-purple-500/50 px-2 py-1 rounded tracking-widest shadow-[0_0_10px_rgba(168,85,247,0.3)]"><i class="fa-solid fa-bolt text-[10px] mr-1"></i>ELITE</span>`;
            } else if (time <= 45.00) {
                return `<span class="text-xs bg-blue-900/60 text-blue-300 border border-blue-500/50 px-2 py-1 rounded tracking-widest"><i class="fa-solid fa-star text-[10px] mr-1"></i>PRO</span>`;
            } else if (time <= 60.00) {
                return `<span class="text-xs bg-green-900/60 text-green-300 border border-green-500/50 px-2 py-1 rounded tracking-widest">CONTENDER</span>`;
            } else {
                return `<span class="text-xs bg-gray-800 text-gray-400 border border-gray-600 px-2 py-1 rounded tracking-widest">ROOKIE</span>`;
            }
        }

        function renderData(competitors, latestComp) {
            window.currentCompetitors = competitors;
            window.latestFinisher = latestComp;
            
            const totalCount = competitors.length;

            // Update Counter Badge
            counterElement.innerHTML = `<span class="w-3 h-3 bg-red-600 rounded-full animate-pulse border border-black shadow-[0_0_8px_rgba(220,38,38,0.8)]"></span>TOP 5 / ${totalCount} FINISHERS`;

            // Handle Button visibility
            if (totalCount > 5) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.innerHTML = isExpanded ? 
                    '<i class="fa-solid fa-chevron-up mr-2"></i> COLLAPSE ROSTER' : 
                    '<i class="fa-solid fa-chevron-down mr-2"></i> VIEW FULL ROSTER';
            } else {
                toggleBtn.classList.add('hidden');
            }

            const displayList = isExpanded ? competitors : competitors.slice(0, 5);

            if (totalCount === 0) {
                emptyState.classList.remove('hidden');
                leaderboardList.innerHTML = '';
            } else {
                emptyState.classList.add('hidden');
                let html = '';
                
                // LATEST FINISHER SPOTLIGHT LOGIC (Now placed at the TOP)
                // If roster is collapsed, and we have a latest finisher, check if they are outside the Top 5
                if (!isExpanded && latestComp) {
                    const latestRank = competitors.findIndex(c => c.name === latestComp.name && c.time === latestComp.time) + 1;
                    
                    if (latestRank > 5) {
                        const latestTierBadge = getTierBadge(latestComp.time);
                        
                        html += `
                            <div class="mb-1 text-center text-hazardYellow font-anton tracking-widest text-sm uppercase">
                                <i class="fa-solid fa-bolt animate-pulse mr-1"></i> Latest Circuit Finisher
                            </div>
                            <div class="bg-[#111] border-2 border-dashed border-hazardYellow/60 rounded p-4 md:p-6 flex items-center shadow-[0_0_15px_rgba(255,215,0,0.15)] mb-6 relative">
                                <div class="grid grid-cols-12 w-full items-center">
                                    <div class="col-span-2 text-center font-anton text-gray-400 tracking-widest text-xl">#${latestRank}</div>
                                    <div class="col-span-6 font-bold text-lg md:text-2xl tracking-wide text-white uppercase break-words flex items-center flex-wrap gap-3">
                                        ${latestComp.name} <div class="font-inter font-normal mt-1 md:mt-0">${latestTierBadge}</div>
                                    </div>
                                    <div class="col-span-4 text-right font-anton text-xl md:text-3xl text-gray-300 tracking-widest">
                                        ${latestComp.time.toFixed(2)}<span class="text-sm md:text-xl text-gray-600 ml-1">s</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                // Render the main list (Top 5, or All) below the spotlight
                displayList.forEach((comp, index) => {
                    const rank = index + 1;
                    let podiumClass = 'bg-darkPanel border border-cardBorder';
                    let rankTextClass = 'text-gray-500';
                    let rankIcon = rank;

                    if (rank === 1) { podiumClass = 'podium-1'; rankTextClass = 'text-gold text-4xl'; rankIcon = '<i class="fa-solid fa-trophy"></i>'; } 
                    else if (rank === 2) { podiumClass = 'podium-2'; rankTextClass = 'text-silver text-3xl'; rankIcon = '<i class="fa-solid fa-medal"></i>'; } 
                    else if (rank === 3) { podiumClass = 'podium-3'; rankTextClass = 'text-bronze text-3xl'; rankIcon = '<i class="fa-solid fa-medal"></i>'; }

                    const tierBadge = getTierBadge(comp.time);

                    html += `
                        <div class="${podiumClass} rounded p-4 md:p-6 flex items-center shadow-md transition-all duration-300">
                            <div class="grid grid-cols-12 w-full items-center">
                                <div class="col-span-2 text-center font-anton ${rankTextClass} tracking-widest text-2xl">${rankIcon}</div>
                                <div class="col-span-6 font-bold text-xl md:text-3xl tracking-wide text-white uppercase break-words flex items-center flex-wrap gap-3">
                                    ${comp.name} <div class="font-inter font-normal mt-1 md:mt-0">${tierBadge}</div>
                                </div>
                                <div class="col-span-4 text-right font-anton text-2xl md:text-4xl text-hazardYellow tracking-widest">
                                    ${comp.time.toFixed(2)}<span class="text-sm md:text-xl text-gray-500 ml-1">s</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                leaderboardList.innerHTML = html;
            }
        }

        async function fetchBoard() {
            try {
                const response = await fetch(sheetUrl + '&t=' + new Date().getTime(), { cache: 'no-store' });
                const data = await response.text();
                
                const rows = data.split('\n').slice(1);
                
                // Parse rows into objects
                let competitors = rows.map(r => {
                    const cols = r.split(',');
                    return cols.length >= 2 ? { 
                        name: cols[0].replace(/"/g, '').trim(), 
                        time: parseFloat(cols[1].replace(/"/g, '').trim()) 
                    } : null;
                }).filter(p => p && !isNaN(p.time));

                // Capture the absolute newest entry before sorting (last row in the sheet)
                let latestComp = competitors.length > 0 ? competitors[competitors.length - 1] : null;

                // Sort ascending (lowest time wins)
                competitors.sort((a, b) => a.time - b.time);

                renderData(competitors, latestComp);

                if(initialLoad) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.classList.add('hidden'), 500);
                    initialLoad = false;
                }

            } catch (err) { 
                console.error('Data error:', err); 
            }

            setTimeout(fetchBoard, 5000);
        }

        fetchBoard();
    </script>
</body>
</html>
